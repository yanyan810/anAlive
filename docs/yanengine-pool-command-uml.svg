<text x="62" y="830" class="section">Command と面割り当ての Undo / Redo</text>
<g transform="translate(90 855)">
  <rect width="565" height="155" rx="7" class="box"/>
  <path d="M0 52H565" class="rule"/>
  
  <text x="282.5" y="34" class="classname">EnemyEditor</text>
  <text x="16" y="81" class="member">- assignmentHistory_: deque&lt;AssignmentEdit&gt;</text>
  <text x="16" y="110" class="member">- ApplySelection(owner)</text>
  <text x="16" y="139" class="member">- StepAssignmentHistory(redo)</text>
</g>
<g transform="translate(920 855)">
  <rect width="590" height="155" rx="7" class="box"/>
  <path d="M0 52H590" class="rule"/>
  
  <text x="295" y="34" class="classname">EnemyEditor::AssignmentEdit</text>
  <text x="16" y="81" class="member">+ faces: vector&lt;Face&gt;  ／  + owner: size_t</text>
  <text x="16" y="110" class="member">+ Execute(editor: EnemyEditor&amp;) const</text>
  <text x="16" y="139" class="member">+ Undo(editor: EnemyEditor&amp;) const</text>
</g>
<path d="M655 904H920" class="relation" marker-start="url(#owned)"/>
<text x="861" y="892" class="count">0..32</text>
<path d="M920 960H655" class="dependency" marker-end="url(#arrow)"/>
<text x="713" y="948" class="label">変更先を引数で受け取る</text>
<path d="M91 1074H142" class="relation" marker-start="url(#owned)"/> <text x="155" y="1081" class="label">所有（コンポジション）</text>
<path d="M455 1074H506" class="relation" marker-start="url(#borrowed)"/> <text x="520" y="1081" class="label">非所有の集約</text>
<path d="M712 1074H765" class="dependency" marker-end="url(#arrow)"/> <text x="778" y="1081" class="label">依存</text>

